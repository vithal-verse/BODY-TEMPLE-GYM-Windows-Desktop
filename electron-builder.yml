# Windows installer configuration (electron-builder).
#   npm run dist:win   ->  release/BodyTempleGym-Setup.exe
appId: com.bodytemple.gym
productName: Body Temple Gym
copyright: Copyright © Body Temple Gym
directories:
  output: release
  buildResources: build
publish: null

# Only the built app and the one runtime dependency go into the package.
files:
  - dist-electron/**/*
  - out/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"
  - "!node_modules/better-sqlite3/deps"
  - "!node_modules/better-sqlite3/src"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linux*.node"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
  - "!node_modules/node-addon-api"

# better-sqlite3 ships ready-made N-API binaries, so nothing is compiled during packaging.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
asar: true
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
electronLanguages:
  - en-US
  - en-GB

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker # per-user install: no administrator rights needed

nsis:
  oneClick: false
  perMachine: false # installs under %LOCALAPPDATA%\Programs — never Program Files
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Body Temple Gym
  runAfterFinish: true
  # The gym's data lives in %APPDATA%\Body Temple Gym and is left alone by updates AND by uninstalling.
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: BodyTempleGym-Setup.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: Body Temple Gym
